name: AI review (advisory)

# AI 1차 리뷰 의견. 병합 조건이 아니다.
# - main 보호의 필수 검사는 quality-gate뿐이며 이 워크플로우는 포함하지 않는다.
# - 리뷰 승인(APPROVE)이나 수정 요청을 제출하지 않고 PR 댓글만 남긴다.
# - 같은 저장소 브랜치의 PR에서만 실행한다. fork PR에는 시크릿이 전달되지 않는다.
# - 본문만 수정(edited)한 경우에는 다시 실행하지 않는다(사용량 절약). 새 커밋이 올라오면 다시 리뷰한다.
# - 한계: gh pr comment 허용 범위에는 자기 댓글 수정·삭제 옵션도 포함되며 권한 규칙으로 분리할 수 없다.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: ai-review
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Claude advisory review
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          prompt: |
            저장소: ${{ github.repository }}
            PR 번호: ${{ github.event.pull_request.number }}
            검토 대상 커밋: ${{ github.event.pull_request.head.sha }}

            너는 AiPrGate 프로세스의 AI 1차 리뷰어다. 이 저장소는 AI로 생성한 코드를
            PR 단계에서 자동 검사와 사람의 검토를 거쳐 병합한다. 네 의견은 참고용이며
            승인으로 집계되지 않는다. 최종 판단은 사람이 한다.

            할 일:
            1. `gh pr view <번호>`로 PR 본문을, `gh pr diff <번호>`로 변경 내용을 읽는다.
               필요하면 Read/Grep/Glob으로 주변 코드를 확인한다.
            2. 본문의 "AI 사용 여부"와 "AI 사용 근거"를 실제 diff와 대조한다.
               신고 내용과 변경 범위가 맞지 않거나 근거가 부족하면 지적한다.
            3. 변경 코드에서 다음을 찾는다: 요구사항·테스트와 어긋나는 동작, 누락된 경계
               사례, 예외 처리 누락, 하드코딩된 키·토큰, 인증서 검증 우회, 불필요한 권한,
               테스트 없이 바뀐 로직. 자동 검사(빌드·JUnit·Lint·Gitleaks)가 이미 잡는
               항목은 반복하지 말고, 검사가 놓칠 수 있는 맥락에 집중한다.
            4. 사람 리뷰어가 작성자에게 물어야 할 질문을 정리한다.

            출력 규칙:
            - `gh pr comment <번호> --body "<내용>"`으로 댓글을 정확히 한 번만 남긴다.
              리뷰 승인·수정 요청·코드 수정·커밋은 하지 않는다.
            - 댓글 첫 줄은 반드시 다음 표식 그대로 쓴다(검토 커밋을 식별해 오래된 의견과 구분하는 데 쓴다):
              <!-- aiprgate:ai-review sha=${{ github.event.pull_request.head.sha }} -->
            - 이어서 한국어로 다음 형식을 따른다.
              ### AI 리뷰 의견 (참고용 · 승인 아님)
              **판단 요약**: 한두 문장
              **AI 사용 신고 대조**: 일치 / 불일치 / 확인 불가 + 이유
              **확인이 필요한 부분**: 파일:줄과 이유를 항목별로. 근거가 약하면 "추정"이라고 쓴다. 없으면 "없음".
              **사람 리뷰어 질문**: 항목별로
            - 확실하지 않은 내용을 단정하지 않는다. 문제가 없으면 없다고 쓴다.
