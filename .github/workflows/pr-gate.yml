name: AI PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-info:
    name: pr-info
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted control from PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .control
          persist-credentials: false
      - uses: ./.control/.github/actions/run-check
        with:
          check: pr-info

  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout trusted control from PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .control
          persist-credentials: false
      - uses: ./.control/.github/actions/run-check
        with:
          check: build-test

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted control from PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .control
          persist-credentials: false
      - uses: ./.control/.github/actions/run-check
        with:
          check: quality

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted control from PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .control
          persist-credentials: false
      - uses: ./.control/.github/actions/run-check
        with:
          check: secrets

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [pr-info, build-test, quality, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted aggregator from PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .control
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Download only this run and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: check-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: received
      - name: Verify receipts and query latest PR
        if: ${{ always() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun -e 'const needs = JSON.parse(process.env.NEEDS_JSON); await Bun.write("needs.json", JSON.stringify(Object.fromEntries(Object.entries(needs).map(([name, job]) => [name, job.result]))));'
          bun ./.control/tools/pr-gate/cli.mjs aggregate \
            --control .control --results received --needs-file needs.json \
            --out gate-results/final
      - name: Preserve final decision and summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-results/final/
          if-no-files-found: error
          retention-days: 14
